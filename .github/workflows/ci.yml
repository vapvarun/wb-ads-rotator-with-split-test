name: CI

# Security note: this workflow uses only trusted inputs
# (matrix values, composer scripts, hashFiles). It intentionally avoids
# any ${{ github.event.* }} user-controlled fields in `run:` blocks.

on:
  push:
    branches: [ main, master, '*.*.*' ]
  pull_request:
  workflow_dispatch:

jobs:

  lint:
    name: PHP Lint (syntax)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Syntax check every PHP file
        run: |
          set -e
          find includes wb-ads-rotator-with-split-test.php \
            -type f -name '*.php' \
            -not -path '*/vendor/*' \
            -not -path '*/node_modules/*' \
            -not -path '*/dist/*' \
            -print0 | xargs -0 -n1 -P4 php -l

  phpstan:
    name: PHPStan level 7
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer phpstan

  phpunit:
    name: PHPUnit (free + pro)
    runs-on: ubuntu-latest

    # This job is the reason the others exist. Until it was added, CI linted and
    # type-checked but ran none of the 100+ tests in this repo - so a green tick
    # meant "it parses", not "it works". Regressions in billing, authorization
    # and placement gating could all reach main unchallenged.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout FREE
        uses: actions/checkout@v4
        with:
          path: wp-content/plugins/wb-ads-rotator-with-split-test

      # The pro suite lives in this repo but exercises the pro plugin, so pro
      # has to be present as the sibling the bootstrap expects. It is a private
      # repo, so this needs a token; without one the pro suite skips itself
      # rather than failing, and the free suite still runs.
      - name: Checkout PRO (sibling — enables the pro suite)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: vapvarun/wb-ad-manager-pro
          token: ${{ secrets.PRO_REPO_TOKEN }}
          path: wp-content/plugins/wb-ad-manager-pro

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
          extensions: mysqli

      - name: Install dependencies
        working-directory: wp-content/plugins/wb-ads-rotator-with-split-test
        run: composer install --no-interaction --prefer-dist --no-progress

      # install-wp-tests.sh pulls the test suite over Subversion, and
      # ubuntu-latest images no longer ship it - the scaffold step fails with
      # "svn: command not found" (exit 127) without this.
      - name: Install Subversion (required by install-wp-tests.sh)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      - name: Install WordPress test scaffold
        working-directory: wp-content/plugins/wb-ads-rotator-with-split-test
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest

      - name: Free suite
        working-directory: wp-content/plugins/wb-ads-rotator-with-split-test
        run: composer test-free

      # Runs only when the PRO checkout above succeeded. Guarded so a missing or
      # expired token degrades to "free suite only" instead of a red build that
      # says nothing about the code.
      - name: Pro suite
        working-directory: wp-content/plugins/wb-ads-rotator-with-split-test
        run: |
          if [ -f ../wb-ad-manager-pro/wb-ad-manager-pro.php ]; then
            composer test-pro
          else
            echo "PRO not checked out (no token) - skipping the pro suite."
          fi
